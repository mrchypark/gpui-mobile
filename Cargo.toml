[package]
name = "gpui-mobile"
version = "0.1.0"
edition = "2021"
authors = ["Balamurali Pandranki <balamurali@live.com>"]
license = "GPL-3.0-or-later OR AGPL-3.0-or-later OR Apache-2.0"
description = "Mobile platform support for GPUI — iOS (wpgu/Metal) and Android (wgpu/Vulkan)"
repository = "https://github.com/mrchypark/gpui-mobile"
homepage = "https://github.com/mrchypark/gpui-mobile"
keywords = ["gui", "mobile", "ios", "android", "gpui"]
categories = ["gui", "os"]
readme = "README.md"

# This checkout uses patched vendored sources. Cargo drops [patch] entries and
# rewrites path dependencies when it packages a crate, so publication stays
# blocked until matching registry releases replace those sources.

[features]
default = ["url_launcher", "shared_preferences", "path_provider",
           "package_info", "device_info", "connectivity", "network_info", "vibration",
           "battery", "share", "sensors", "webview", "file_selector", "image_picker", "camera",
           "permission_handler", "notifications", "location", "audio", "video_player",
           "clipboard", "local_auth", "in_app_review", "contacts", "maps_launcher",
           "calendar", "deeplink", "microphone", "maps", "media_session"]
url_launcher = []
shared_preferences = []
path_provider = []
package_info = []
device_info = []
connectivity = []
network_info = []
vibration = []
battery = []
share = []
sensors = []
webview = []
file_selector = []
image_picker = []
camera = []
permission_handler = []
notifications = []
location = []
audio = []
video_player = []
clipboard = []
local_auth = []
in_app_review = []
contacts = []
maps_launcher = []
maps = []
calendar = []
deeplink = []
microphone = []
media_session = []
ble = ["dep:btleplug", "dep:tokio"]

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

# ── shared deps (all platforms) ──────────────────────────────────────────────

[dependencies]
mobile-ime-core = "=0.1.0"
anyhow       = "1"
log          = { version = "0.4", features = ["kv_unstable_serde", "serde"] }
parking_lot  = "0.12"
futures      = "0.3"
raw-window-handle = "0.6"
# Android fixes live in the vendored source; crates.io packages would select =0.13.5.
btleplug = { version = "=0.13.5", path = "src/packages/ble/vendor/btleplug-0.13.5", optional = true }
tokio = { version = "1.53.1", features = ["rt", "time"], optional = true }

# ── GPUI core crate (provides Platform trait, event types, geometry, etc.) ───
gpui = { package = "gpui-fast", version = "=0.1.14", default-features = false }

[build-dependencies]
cc = "1"

# ── iOS ──────────────────────────────────────────────────────────────────────

[target.'cfg(target_os = "ios")'.dependencies]
# Objective-C runtime
objc2 = "0.6"

# Apple frameworks
core-foundation     = "0.10"
core-foundation-sys = "0.8"
core-graphics       = "0.24"
core-text           = "=21.0.0"
uuid                = { version = "1", features = ["v4", "v5"] }
block2              = "0.6"
libc                = "=0.2.191"

# wgpu renderer (Metal backend on iOS/Android)
gpui_wgpu = { package = "gpui-fast-wgpu", version = "=0.1.14", features = ["font-kit"] }
wgpu = "30.0.1"

# Text / font stack
pathfinder_geometry = "0.5"
smallvec            = { version = "1.6", features = ["union", "const_new"] }

# font-kit (same pin as gpui upstream)
font-kit = { package = "zed-font-kit", version = "0.14.1-zed" }

# ── Android ──────────────────────────────────────────────────────────────────

[target.'cfg(target_os = "android")'.dependencies]
# JNI / NDK bindings
jni         = "0.22"
libc        = "=0.2.191"
# Keep `ndk` on the baseline `nativewindow` feature set. Enabling
# `api-level-31` links API 31 symbols directly, so the shared library
# fails to `dlopen` on older Android versions before our own code runs.
ndk         = { version = "0.9", features = ["nativewindow"] }
ndk-context = "0.1"
ndk-sys     = "0.6"

# Activity glue layer
android-activity = { version = "0.6", features = ["native-activity"] }

# Logging to logcat
android_logger = "0.15"

# TalkBack: exposes GPUI's AccessKit tree (accesskit 0.24, as gpui).
accesskit_android = { version = "0.7.5", features = ["embedded-dex"] }

# wgpu renderer (Vulkan backend on Android)
gpui_wgpu = { package = "gpui-fast-wgpu", version = "=0.1.14" }

# rustc-hash is required by the PlatformKeyboardMapper trait signature
rustc-hash = "2"
uuid       = { version = "1", features = ["v5"] }

# ── dev ──────────────────────────────────────────────────────────────────────

[dev-dependencies]
gpui = { package = "gpui-fast", version = "=0.1.14", default-features = false, features = ["test-support"] }

# Cargo applies patches only from the application workspace root, and omits them
# from published packages. Git consumers must repeat these patches.
[patch.crates-io]
gpui-fast = { path = "vendor/gpui-fast" }
gpui-fast-wgpu = { path = "vendor/gpui-fast-wgpu" }
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }

# ── profiles ─────────────────────────────────────────────────────────────────

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true

[profile.dev]
opt-level = 0
debug     = true
