[package]
name = "gpui-mobile-example"
version = "0.1.0"
edition = "2021"
description = "Cross-platform GPUI example app for Android and iOS"
publish = false

[features]
ble = ["gpui-mobile/ble"]

[lib]
name = "gpui_mobile_example"
crate-type = ["cdylib", "staticlib", "lib"]
path = "src/lib.rs"

[[bin]]
name = "gpui-example"
path = "src/main.rs"

[dependencies]
gpui-mobile = { path = ".." }
gpui = { package = "gpui-fast", version = "=0.1.14", default-features = false }
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.12" }
log = "0.4"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
android-activity = { version = "0.6", features = ["native-activity"] }

[patch.crates-io]
gpui-fast = { path = "../vendor/gpui-fast" }
gpui-fast-wgpu = { path = "../vendor/gpui-fast-wgpu" }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
