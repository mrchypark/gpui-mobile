name: CI — Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Host check + unit tests (macOS — needed for iOS SDK headers)
  # ─────────────────────────────────────────────────────────────────────────────
  host:
    name: Host Check & Tests
    runs-on: macos-14 # Apple Silicon runner — has Xcode + iOS SDKs
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry + git deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: host-1.99-cargo-${{ hashFiles('Cargo.toml') }}
          restore-keys: host-1.99-cargo-

      - name: cargo check (host)
        run: cargo check --all-targets --features ble

      - name: cargo test (unit tests)
        run: cargo test --lib --features ble

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings || true
        # clippy warnings are informational for now; don't fail the build

  # ─────────────────────────────────────────────────────────────────────────────
  # iOS cross-compilation
  # ─────────────────────────────────────────────────────────────────────────────
  ios:
    name: iOS Build (${{ matrix.target }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-ios
            label: device
          - target: aarch64-apple-ios-sim
            label: simulator
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain + iOS target
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry + git deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ios-1.97.1-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.toml') }}
          restore-keys: ios-1.97.1-${{ matrix.target }}-cargo-

      - name: cargo check — gpui-mobile (${{ matrix.label }})
        run: cargo check --target ${{ matrix.target }} --features ble

      - name: cargo check — example app (${{ matrix.label }})
        working-directory: example
        run: cargo check --target ${{ matrix.target }} --features ble --locked

  # ─────────────────────────────────────────────────────────────────────────────
  # Android cross-compilation
  # ─────────────────────────────────────────────────────────────────────────────
  android:
    name: Android Build (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain + Android target
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-linux-android

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Resolve NDK path
        run: |
          # Use the NDK provided by setup-android (ANDROID_NDK_ROOT)
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"

      - name: Add NDK toolchain to PATH
        run: |
          TOOLCHAIN_DIR="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$TOOLCHAIN_DIR" >> "$GITHUB_PATH"
          ls "$TOOLCHAIN_DIR"/aarch64-linux-android*-clang || true

      - name: Configure Cargo for Android cross-compilation
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-linux-android]
          linker = "aarch64-linux-android35-clang"
          EOF
          cat .cargo/config.toml

      - name: Cache Cargo registry + git deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: android-1.97.1-cargo-${{ hashFiles('Cargo.toml') }}
          restore-keys: android-1.97.1-cargo-

      - name: cargo check — gpui-mobile (Android aarch64)
        run: cargo check --target aarch64-linux-android --features ble

      - name: cargo check — example app (Android aarch64)
        working-directory: example
        run: cargo check --target aarch64-linux-android --features ble --locked

  # ─────────────────────────────────────────────────────────────────────────────
  # Android APK build (Gradle)
  # ─────────────────────────────────────────────────────────────────────────────
  android-apk:
    name: Android APK (Gradle)
    runs-on: ubuntu-latest
    needs: android
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain + Android target
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Resolve NDK path
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Cargo registry + git deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            example/target
          key: android-apk-1.97.1-cargo-${{ hashFiles('example/Cargo.lock', 'example/Cargo.toml') }}
          restore-keys: android-apk-1.97.1-cargo-

      - name: Build Rust shared library via cargo-ndk
        working-directory: example
        run: |
          cargo ndk \
            -t arm64-v8a \
            -P 31 \
            -o android/gradle/app/build/generated/jniLibs/debug \
            build --features ble --locked

      - name: Assemble BLE debug APK with the already-built Rust library
        working-directory: example/android/gradle
        run: ./gradlew -Pble=true -x :app:buildBleRust assembleDebug

      - name: Verify the APK contains the arm64 native library
        run: unzip -Z1 example/android/gradle/app/build/outputs/apk/debug/app-debug.apk | grep -Fx lib/arm64-v8a/libgpui_mobile_example.so

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: gpui-example-debug.apk
          path: example/android/gradle/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  ely-integration:
    name: Ely Integration
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-apple-ios-sim

      - name: Install Rust toolchain for host check
        run: rustup toolchain install 1.99.0 --profile minimal

      - name: Cache Cargo registry, git deps, and example target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            examples/ely-integration/target
          key: ely-1.97.1-cargo-${{ hashFiles('examples/ely-integration/Cargo.lock') }}
          restore-keys: ely-1.97.1-cargo-

      - name: cargo check — Ely integration example
        working-directory: examples/ely-integration
        run: |
          cargo +1.99.0 check --lib --locked
          cargo +1.97.1 check --lib --locked --target aarch64-apple-ios-sim

  ely-integration-android:
    name: Ely Integration Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain + Android target
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-linux-android

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Resolve NDK path
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"

      - name: Add NDK toolchain to PATH
        run: |
          toolchain_dir="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$toolchain_dir" >> "$GITHUB_PATH"

      - name: Configure Cargo for Android cross-compilation
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [target.aarch64-linux-android]
          linker = "aarch64-linux-android35-clang"
          EOF

      - name: Cache Cargo registry, git deps, and example target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            examples/ely-integration/target
          key: ely-android-1.97.1-cargo-${{ hashFiles('examples/ely-integration/Cargo.lock') }}
          restore-keys: ely-android-1.97.1-cargo-

      - name: cargo check — Ely integration example (Android)
        working-directory: examples/ely-integration
        run: cargo check --lib --locked --target aarch64-linux-android
